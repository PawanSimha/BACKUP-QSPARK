{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:3rem auto">
  <div class="card-body text-center">
    <div class="text-4xl font-bold text-slate-300">{{ code }}</div>
    <h1 class="text-lg font-semibold mt-2 mb-1">
      {% if code == 404 %}Page not found{% elif code == 403 %}Access denied{% else %}Something went wrong{% endif %}
    </h1>
    <p class="text-sm text-muted mb-4">{{ message }}</p>
    <a class="btn btn-primary" href="/dashboard">Back to dashboard</a>
  </div>
</div>
{% endblock %}
